<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }
        canvas {
            border: 1px solid white;
        }
    </style>
</head>
<body>
    <canvas id="pong" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById('pong');
        const ctx = canvas.getContext('2d');

        // Creating the paddle
        const paddleWidth = 10, paddleHeight = 100;
        const user = {
            x: 0,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "white",
            score: 0
        };
        const computer = {
            x: canvas.width - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            color: "white",
            score: 0
        };

        // Creating the ball
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            size: 10,
            speed: 4,
            velocityX: 4,
            velocityY: 4,
            color: "white"
        };

        // Draw function
        function drawRect(x, y, w, h, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, w, h);
        }

        function drawArc(x, y, size, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2, false);
            ctx.closePath();
            ctx.fill();
        }

        // Update function
        function update() {
            ball.x += ball.velocityX;
            ball.y += ball.velocityY;
            // Ball collision with top and bottom walls
            if (ball.y + ball.size > canvas.height || ball.y - ball.size < 0) {
                ball.velocityY = -ball.velocityY;
            }
            // Ball collision with paddles
            if (ball.x - ball.size < user.x + user.width && ball.y > user.y && ball.y < user.y + user.height) {
                ball.velocityX = -ball.velocityX;
            }
            if (ball.x + ball.size > computer.x && ball.y > computer.y && ball.y < computer.y + computer.height) {
                ball.velocityX = -ball.velocityX;
            }
            // Reset ball if it goes out of bounds
            if (ball.x - ball.size < 0) {
                computer.score++;
                resetBall();
            } else if (ball.x + ball.size > canvas.width) {
                user.score++;
                resetBall();
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.velocityX = -ball.velocityX;
        }

        // Render function
        function render() {
            drawRect(0, 0, canvas.width, canvas.height, "black");
            drawRect(user.x, user.y, user.width, user.height, user.color);
            drawRect(computer.x, computer.y, computer.width, computer.height, computer.color);
            drawArc(ball.x, ball.y, ball.size, ball.color);
            ctx.fillStyle = "white";
            ctx.font = "35px Arial";
            ctx.fillText(user.score, canvas.width / 4, canvas.height / 5);
            ctx.fillText(computer.score, 3 * canvas.width / 4, canvas.height / 5);
        }

        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Control the user paddle
        document.addEventListener('mousemove', function(event) {
            const rect = canvas.getBoundingClientRect();
            user.y = event.clientY - rect.top - user.height / 2;
        });

        // Computer AI
        function computerAI() {
            if (computer.y < ball.y) {
                computer.y += 4;
            } else {
                computer.y -= 4;
            }
        }

        // Start the game
        gameLoop();
    </script>
</body>
</html>
